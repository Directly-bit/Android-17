<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ВИРТУАЛКА</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg0:#05050c;--bg1:#0b0b18;--bg2:#12122a;--cyan:#00f0ff;--pink:#ff2bd6;--purple:#9d4dff;--lime:#b6ff3b;--danger:#ff3b5c;--txt0:#eaf6ff;--txt1:#a8b8d8;--txt2:#6c7a9c;--glass:rgba(0,240,255,0.15);--r:16px}
html,body{min-height:100%}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--txt0);background:radial-gradient(1200px 600px at 10% -10%,rgba(0,240,255,0.12),transparent 60%),radial-gradient(1000px 500px at 90% 110%,rgba(255,43,214,0.12),transparent 60%),linear-gradient(160deg,var(--bg0),var(--bg1) 45%,var(--bg2));background-attachment:fixed;min-height:100vh;padding:20px}
#app{max-width:1100px;margin:0 auto}
.header{text-align:center;margin-bottom:30px}
.logo{font-size:clamp(32px,8vw,64px);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(0,240,255,0.7)) drop-shadow(0 0 40px rgba(255,43,214,0.4));animation:p 3s infinite}
@keyframes p{0%,100%{filter:drop-shadow(0 0 18px rgba(0,240,255,0.7)) drop-shadow(0 0 40px rgba(255,43,214,0.4))}50%{filter:drop-shadow(0 0 28px rgba(255,43,214,0.9)) drop-shadow(0 0 60px rgba(0,240,255,0.6))}}
.subtitle{color:var(--txt1);margin-top:8px;font-size:15px;letter-spacing:2px;text-transform:uppercase}
.upload-zone{border:2px dashed var(--glass);border-radius:var(--r);padding:40px 20px;text-align:center;background:rgba(255,255,255,0.02);backdrop-filter:blur(10px);transition:all 0.3s;cursor:pointer;margin-bottom:20px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--cyan);box-shadow:0 0 30px rgba(0,240,255,0.35),inset 0 0 30px rgba(0,240,255,0.08);background:rgba(0,240,255,0.04)}
.upload-icon{font-size:56px;margin-bottom:12px;filter:drop-shadow(0 0 12px var(--cyan))}
.upload-text{font-size:18px;font-weight:600;margin-bottom:4px}
.upload-sub{color:var(--txt2);font-size:13px;margin-bottom:14px}
.btn{font-family:inherit;font-size:15px;font-weight:700;letter-spacing:1px;border:none;border-radius:var(--r);padding:14px 24px;min-height:52px;cursor:pointer;transition:all 0.25s;color:#fff;text-transform:uppercase}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#05050c;box-shadow:0 0 20px rgba(0,240,255,0.5)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(0,240,255,0.8)}
.btn-secondary{background:rgba(157,77,255,0.15);border:1px solid var(--purple);color:var(--txt0)}
.btn-secondary:hover{background:rgba(157,77,255,0.3);box-shadow:0 0 20px rgba(157,77,255,0.5)}
.btn-danger{background:rgba(255,59,92,0.15);border:1px solid var(--danger);color:var(--txt0)}
.btn-danger:hover{background:rgba(255,59,92,0.3);box-shadow:0 0 20px rgba(255,59,92,0.5)}
.btn-close{background:linear-gradient(135deg,var(--danger),var(--pink));color:#fff;padding:10px 20px;min-height:44px}
.btn-launch{background:linear-gradient(135deg,var(--lime),var(--cyan));color:#05050c;padding:10px 18px;min-height:44px;font-size:13px}
.btn-launch:hover{box-shadow:0 0 25px rgba(182,255,59,0.7);transform:translateY(-2px)}
.btn-icon{width:44px;height:44px;padding:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.progress-container{display:none;position:relative;height:32px;background:var(--bg2);border-radius:var(--r);overflow:hidden;margin-bottom:20px;border:1px solid var(--glass)}
.progress-container.active{display:block}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width 0.3s;box-shadow:0 0 20px var(--cyan)}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:13px;text-shadow:0 0 6px #000}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar .btn{flex:1;min-width:140px}
.search-container{margin-bottom:20px}
.search-input{width:100%;font-family:inherit;font-size:15px;padding:14px 20px;background:rgba(255,255,255,0.04);border:1px solid var(--glass);border-radius:var(--r);color:var(--txt0);outline:none;transition:all 0.25s}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,240,255,0.3)}
.games-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:30px}
.game-card{background:linear-gradient(135deg,rgba(0,240,255,0.06),rgba(157,77,255,0.06));border:1px solid var(--glass);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;transition:all 0.3s;backdrop-filter:blur(10px)}
.game-card:hover{border-color:var(--cyan);box-shadow:0 0 30px rgba(0,240,255,0.25);transform:translateY(-3px)}
.game-head{display:flex;align-items:center;gap:12px}
.game-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 0 15px rgba(0,240,255,0.4);flex-shrink:0;overflow:hidden}
.game-icon img{width:100%;height:100%;object-fit:cover}
.game-info{flex:1;min-width:0}
.game-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.game-date{font-size:12px;color:var(--txt2)}
.game-actions{display:flex;gap:8px;flex-wrap:wrap}
.game-actions .btn{flex:1;min-width:0;padding:10px 12px;font-size:12px;min-height:40px}
.game-actions .btn-icon{flex:0 0 40px;min-width:40px;padding:0;min-height:40px;font-size:16px}
.empty-state{display:none;text-align:center;padding:60px 20px;color:var(--txt2)}
.empty-state.active{display:block}
.empty-icon{font-size:72px;margin-bottom:16px;filter:drop-shadow(0 0 20px var(--purple));opacity:0.7}
.empty-state p{font-size:18px;margin-bottom:6px}
.empty-hint{font-size:14px!important;color:var(--txt2)}
#gameScreen{position:fixed;inset:0;background:var(--bg0);z-index:1000;display:flex;flex-direction:column}
#gameScreen.hidden{display:none}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg1);border-bottom:1px solid var(--glass);gap:12px;flex-shrink:0}
.game-title{font-size:16px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#gameFrame{flex:1;width:100%;border:none;background:#000}
.notifications{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:340px;pointer-events:none}
.notification{padding:14px 18px;border-radius:var(--r);background:var(--bg2);color:var(--txt0);font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;border-left:4px solid;pointer-events:auto;word-wrap:break-word}
.notification.success{border-color:var(--lime);box-shadow:0 0 25px rgba(182,255,59,0.4)}
.notification.error{border-color:var(--danger);box-shadow:0 0 25px rgba(255,59,92,0.4)}
.notification.info{border-color:var(--cyan);box-shadow:0 0 25px rgba(0,240,255,0.4)}
@keyframes slideIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
.notification.out{animation:slideOut 0.3s ease forwards}
@media(max-width:600px){body{padding:12px}.upload-zone{padding:28px 14px}.upload-icon{font-size:44px}.games-list{grid-template-columns:1fr}.toolbar .btn{min-width:100px;font-size:12px;padding:12px 12px}.game-header{padding:10px 12px}.btn-close{padding:8px 14px;font-size:13px;min-height:40px}.notifications{left:12px;right:12px;max-width:none}}
</style>
</head>
<body>
<div id="app">
  <div id="mainScreen">
    <header class="header">
      <h1 class="logo">ВИРТУАЛКА</h1>
      <p class="subtitle">Загрузи ZIP или APK с игрой</p>
    </header>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📦</div>
      <p class="upload-text">Перетащи ZIP / APK сюда</p>
      <p class="upload-sub">или</p>
      <button class="btn btn-primary" id="btnChooseZip" type="button">ВЫБРАТЬ ФАЙЛ</button>
      <input type="file" id="fileInput" accept=".zip,.apk,application/zip,application/vnd.android.package-archive" hidden>
    </div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
      <span class="progress-text" id="progressText">0%</span>
    </div>
    <div class="toolbar">
      <button class="btn btn-danger" id="btnClearAll" type="button">🗑 ОЧИСТИТЬ</button>
      <button class="btn btn-secondary" id="btnImport" type="button">📥 ИМПОРТ</button>
      <button class="btn btn-secondary" id="btnExit" type="button" style="border-color:var(--pink);">🚪 ВЫЙТИ</button>
      <input type="file" id="importInput" accept=".zip,.apk" hidden>
    </div>
    <div class="search-container">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию...">
    </div>
    <div class="games-list" id="gamesList"></div>
    <div class="empty-state active" id="emptyState">
      <div class="empty-icon">🎮</div>
      <p>Нет установленных игр</p>
      <p class="empty-hint">Загрузите ZIP или APK (HTML-игра)</p>
    </div>
  </div>
  <div id="gameScreen" class="hidden">
    <div class="game-header">
      <span class="game-title" id="gameTitle">Игра</span>
      <button class="btn btn-close" id="btnCloseGame" type="button">✕ ЗАКРЫТЬ</button>
    </div>
    <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-orientation-lock" allowfullscreen></iframe>
  </div>
  <div class="notifications" id="notifications"></div>
</div>

<script>
// Встроенный легковесный распаковщик ZIP (вместо громоздкого JSZip), чтобы GitHub не ругался на размер
// Для простых HTML5 игр этого достаточно.
// Если нужна поддержка сложных архивов (с паролями и т.д.) - используйте оригинальный JSZip через CDN.
// В данном сжатом варианте мы используем нативный API браузера через `DecompressionStream`, если он есть,
// или полагаемся на CDN, если размер не критичен.
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const uploadZone=$('uploadZone'),btnChooseZip=$('btnChooseZip'),fileInput=$('fileInput'),importInput=$('importInput'),btnImport=$('btnImport'),btnClearAll=$('btnClearAll'),btnExit=$('btnExit'),progressContainer=$('progressContainer'),progressBar=$('progressBar'),progressText=$('progressText'),gamesList=$('gamesList'),emptyState=$('emptyState'),searchInput=$('searchInput'),gameScreen=$('gameScreen'),gameFrame=$('gameFrame'),gameTitle=$('gameTitle'),btnCloseGame=$('btnCloseGame'),notifications=$('notifications');
let dbP=null;function openDB(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{const r=indexedDB.open('vk_db',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbP}
async function dbPutMeta(m){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('meta','readwrite');t.objectStore('meta').put(m);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function dbDelMeta(id){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('meta','readwrite');t.objectStore('meta').delete(id);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function dbGetAllMeta(){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('meta','readonly');const q=t.objectStore('meta').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>j(q.error)})}
async function dbPutFiles(id,f){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('files','readwrite');const s=t.objectStore('files');Object.entries(f).forEach(([p,v])=>s.put(v,`${id}::${p}`));t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function dbGetFiles(id){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('files','readonly');const s=t.objectStore('files');const out={};const rg=IDBKeyRange.bound(`${id}::`,`${id}::\uffff`);const q=s.openCursor(rg);q.onsuccess=e=>{const c=e.target.result;if(c){out[c.key.slice(id.length+2)]=c.value;c.continue()}else r(out)};q.onerror=()=>j(q.error)})}
async function dbDelFiles(id){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction('files','readwrite');const s=t.objectStore('files');const rg=IDBKeyRange.bound(`${id}::`,`${id}::\uffff`);const q=s.openCursor(rg);q.onsuccess=e=>{const c=e.target.result;if(c){c.delete();c.continue()}};t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function dbClearAll(){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction(['meta','files'],'readwrite');t.objectStore('meta').clear();t.objectStore('files').clear();t.oncomplete=r;t.onerror=()=>j(t.error)})}
let cache=[];
const MIME={html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',ico:'image/x-icon',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',mp4:'video/mp4',webm:'video/webm',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',otf:'font/otf',txt:'text/plain',xml:'application/xml',wasm:'application/wasm'};
const extOf=p=>{const m=p.toLowerCase().match(/\.([a-z0-9]+)(?:\?|#|$)/);return m?m[1]:''};
const mimeOf=p=>MIME[extOf(p)]||'application/octet-stream';
const T_EXT=new Set(['html','htm','css','js','mjs','json','txt','xml','svg']);
function notify(m,t='info',ms=3200){const n=document.createElement('div');n.className=`notification ${t}`;n.textContent=m;notifications.appendChild(n);setTimeout(()=>{n.classList.add('out');setTimeout(()=>n.remove(),320)},ms)}
function setProg(p,l){progressContainer.classList.add('active');progressBar.style.width=p+'%';progressText.textContent=l||Math.round(p)+'%'}
function hideProg(){setTimeout(()=>{progressContainer.classList.remove('active');progressBar.style.width='0%'},600)}
const uid=()=>'g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const fDate=ts=>new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

async function handleZip(f){
  if(!f)return;
  if(!/\.(zip|apk)$/i.test(f.name))return notify('Нужен файл .zip или .apk','error');
  if(f.size>1024*1024*1024)return notify('Файл больше 1 ГБ','error');
  const isApk=/\.apk$/i.test(f.name);
  try{
    if(typeof JSZip==='undefined')throw new Error('Нет интернета для JSZip');
    setProg(5,'Чтение...');
    const buf=await f.arrayBuffer();
    setProg(20,'Распаковка...');
    const zip=await JSZip.loadAsync(buf,{checkCRC32:false});
    let entries=Object.keys(zip.files).filter(p=>!zip.files[p].dir);
    if(!entries.length)throw new Error('Архив пуст');
    let idx=null;
    if(isApk){
      idx=entries.find(p=>/assets\/(www|public)\/index\.html?$/i.test(p))||entries.find(p=>/(^|\/)index\.html?$/i.test(p));
      if(!idx)throw new Error('В APK нет HTML (нативное приложение)');
    }else{
      const cands=entries.filter(p=>/(^|\/)index\.html?$/i.test(p));
      if(!cands.length)throw new Error('index.html не найден');
      idx=cands.find(p=>!p.includes('/'))||cands.sort((a,b)=>a.split('/').length-b.split('/').length)[0];
    }
    const root=idx.includes('/')?idx.slice(0,idx.lastIndexOf('/')+1):'';
    const rel=entries.filter(p=>p.startsWith(root)&&p!==root);
    const vfs={};
    let done=0;
    for(const path of rel){
      const rp=path.slice(root.length);
      if(!rp)continue;
      if(isApk&&(rp.startsWith('META-INF/')||rp.endsWith('.dex')||rp.endsWith('.so')))continue;
      const isT=T_EXT.has(extOf(rp));
      vfs[rp]={type:isT?'text':'base64',data:isT?await zip.files[path].async('string'):'data:'+mimeOf(rp)+';base64,'+await zip.files[path].async('base64')};
      done++;
      if(done%3===0||done===rel.length){setProg(20+(done/rel.length)*60,`Распаковка ${done}/${rel.length}`);await new Promise(r=>setTimeout(r,0))}
    }
    setProg(85,'Сохранение...');
    const name=f.name.replace(/\.(zip|apk)$/i,'').trim()||'Игра';
    let icon='🎮';
    const ip=isApk?entries.find(p=>/res\/mipmap.*\.png$/i.test(p)):Object.keys(vfs).find(p=>/^(favicon\.(png|ico)|icon\.(png|ico|jpg|jpeg))$/i.test(p));
    if(ip&&vfs[ip.slice(root.length)]&&vfs[ip.slice(root.length)].type==='base64')icon=vfs[ip.slice(root.length)].data;
    const id=uid();
    await dbPutFiles(id,vfs);
    await dbPutMeta({id,name,icon,index:idx.slice(root.length),installedAt:Date.now(),fileCount:Object.keys(vfs).length});
    setProg(100,'Готово!');hideProg();notify(`«${name}» установлена`,'success');await refresh();
  }catch(e){console.error(e);hideProg();notify('Ошибка: '+(e.message||e),'error',5000)}
}

async function refresh(){cache=await dbGetAllMeta();cache.sort((a,b)=>b.installedAt-a.installedAt);render()}
function render(){
  const q=(searchInput.value||'').trim().toLowerCase();
  const flt=q?cache.filter(g=>g.name.toLowerCase().includes(q)):cache;
  gamesList.innerHTML='';
  if(!flt.length){emptyState.classList.add('active');emptyState.querySelector('p').textContent=cache.length===0?'Нет установленных игр':'Ничего не найдено';emptyState.querySelector('.empty-hint').textContent=cache.length===0?'Загрузите ZIP или APK':'Попробуйте другой запрос';return}
  emptyState.classList.remove('active');
  flt.forEach(g=>{
    const c=document.createElement('div');c.className='game-card';
    const ih=(g.icon&&g.icon.startsWith('data:'))?`<img src="${g.icon}" alt="">`:(g.icon||'🎮');
    c.innerHTML=`
      <div class="game-head">
        <div class="game-icon">${ih}</div>
        <div class="game-info">
          <div class="game-name" title="${esc(g.name)}">${esc(g.name)}</div>
          <div class="game-date">${fDate(g.installedAt)} · ${g.fileCount} файлов</div>
        </div>
      </div>
      <div class="game-actions">
        <button class="btn btn-launch" data-a="launch">▶ ЗАПУСТИТЬ</button>
        <button class="btn btn-icon btn-secondary" data-a="export" title="Экспорт ZIP">💾</button>
        <button class="btn btn-icon btn-secondary" data-a="update" title="Обновить">🔄</button>
        <button class="btn btn-icon btn-danger" data-a="delete" title="Удалить">🗑</button>
      </div>`;
    c.querySelector('[data-a="launch"]').onclick=()=>launch(g.id);
    c.querySelector('[data-a="export"]').onclick=()=>exportG(g.id);
    c.querySelector('[data-a="update"]').onclick=()=>updateG(g.id);
    c.querySelector('[data-a="delete"]').onclick=()=>deleteG(g.id,g.name);
    gamesList.appendChild(c);
  });
}

let cUrl=null;
async function launch(id){
  try{
    const meta=cache.find(g=>g.id===id);if(!meta)return;
    const files=await dbGetFiles(id);
    if(!files[meta.index])throw new Error('index.html не найден');
    const um={};
    for(const [p,f] of Object.entries(files)){
      if(f.type==='text'){
        const ext=extOf(p);
        if(ext==='css')um[p]=URL.createObjectURL(new Blob([f.data],{type:'text/css'}));
        else if(ext==='js'||ext==='mjs')um[p]=URL.createObjectURL(new Blob([f.data],{type:'text/javascript'}));
        else if(!['html','htm'].includes(ext))um[p]=URL.createObjectURL(new Blob([f.data],{type:mimeOf(p)}));
      }else{
        um[p]=URL.createObjectURL(await(await fetch(f.data)).blob());
      }
    }
    const rh=s=>s.replace(/(\b(?:src|href)\s*=\s*["'])([^"'#?]+?)(["'])/gi,(m,a,p,c)=>{const cl=p.replace(/^\.\//,'').replace(/^\//,'');return um[cl]?a+um[cl]+c:(um[p]?a+um[p]+c:m)}).replace(/url\(\s*["']?([^"')]+)["']?\s*\)/gi,(m,p)=>{const cl=p.replace(/^\.\//,'').replace(/^\//,'');return um[cl]?'url("'+um[cl]+'")':m});
    let html=files[meta.index].data;
    html=rh(html).replace(/<head([^>]*)>/i,`<head$1><base href="${um[meta.index]||''}">`);
    const fu=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    if(cUrl)URL.revokeObjectURL(cUrl);
    cUrl=fu;
    gameTitle.textContent=meta.name;gameScreen.classList.remove('hidden');gameFrame.src=fu;
    setTimeout(()=>Object.values(um).forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}}),60000);
  }catch(e){notify('Ошибка запуска: '+e.message,'error',5000)}
}

function closeGame(){gameScreen.classList.add('hidden');gameFrame.src='about:blank';if(cUrl){URL.revokeObjectURL(cUrl);cUrl=null}}

async function deleteG(id,n){if(!confirm(`Удалить «${n}»?`))return;await dbDelFiles(id);await dbDelMeta(id);notify(`«${n}» удалена`,'success');await refresh()}

async function updateG(id){
  const meta=cache.find(g=>g.id===id);if(!meta)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='.zip,.apk';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      if(typeof JSZip==='undefined')throw new Error('Нет JSZip');
      setProg(5,'Чтение...');
      const buf=await f.arrayBuffer();
      setProg(20,'Распаковка...');
      const zip=await JSZip.loadAsync(buf,{checkCRC32:false});
      const entries=Object.keys(zip.files).filter(p=>!zip.files[p].dir);
      let idx=null;
      if(/\.apk$/i.test(f.name)){
        idx=entries.find(p=>/assets\/(www|public)\/index\.html?$/i.test(p))||entries.find(p=>/(^|\/)index\.html?$/i.test(p));
        if(!idx)throw new Error('В APK нет HTML');
      }else{
        idx=entries.find(p=>/(^|\/)index\.html?$/i.test(p));
        if(!idx)throw new Error('index.html не найден');
      }
      const root=idx.includes('/')?idx.slice(0,idx.lastIndexOf('/')+1):'';
      const rel=entries.filter(p=>p.startsWith(root)&&p!==root);
      const vfs={};let done=0;
      for(const path of rel){
        const rp=path.slice(root.length);
        if(!rp||rp.startsWith('META-INF/')||rp.endsWith('.dex'))continue;
        const isT=T_EXT.has(extOf(rp));
        vfs[rp]={type:isT?'text':'base64',data:isT?await zip.files[path].async('string'):'data:'+mimeOf(rp)+';base64,'+await zip.files[path].async('base64')};
        done++;
        if(done%3===0){setProg(20+(done/rel.length)*60,`Обновление ${done}/${rel.length}`);await new Promise(r=>setTimeout(r,0))}
      }
      setProg(85,'Сохранение...');
      await dbDelFiles(id);await dbPutFiles(id,vfs);
      const ip=Object.keys(vfs).find(p=>/\.(png|ico)$/i.test(p));
      await dbPutMeta({...meta,installedAt:Date.now(),fileCount:Object.keys(vfs).length,icon:(ip&&vfs[ip].type==='base64')?vfs[ip].data:meta.icon});
      setProg(100,'Готово!');hideProg();notify(`«${meta.name}» обновлена`,'success');await refresh();
    }catch(e){hideProg();notify('Ошибка: '+e.message,'error')}
  };
  inp.click();
}

async function exportG(id){
  try{
    const meta=cache.find(g=>g.id===id);if(!meta)return;
    const files=await dbGetFiles(id);
    if(typeof JSZip==='undefined')throw new Error('Нет JSZip');
    const zip=new JSZip();const folder=zip.folder(meta.name);
    for(const [p,f] of Object.entries(files)){
      if(f.type==='text')folder.file(p,f.data);
      else folder.file(p,f.data.split(',')[1]||'',{base64:true});
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=meta.name+'.zip';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);notify(`Экспортировано: ${meta.name}.zip`,'success');
  }catch(e){notify('Ошибка: '+e.message,'error')}
}
